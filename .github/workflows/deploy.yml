name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - run: sleep 30  # artifact listing lags the upload; deploy-pages failed with 'No artifacts named github-pages'
      - id: d
        uses: actions/deploy-pages@v5
